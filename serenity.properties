# Serenity Configuration
webdriver.driver=chrome
serenity.take.screenshots=FOR_EACH_ACTION
serenity.verbose.screenshots=true
serenity.report.encoding=UTF-8
serenity.report.title=Serenity Screenplay Tests

# Chrome Configuration
chrome.switches=--disable-password-manager;--disable-save-password-bubble;--disable-credentials-autocomplete;--disable-autofill;--disable-features=TranslateUI,PasswordManagerOnboarding,PasswordLeakDetection,AutofillServerCommunication,PasswordsUIWarningServiceEnabled;--disable-sync;--disable-blink-features=AutomationControlled;--start-maximized;--no-sandbox;--disable-dev-shm-usage;--window-size=1920,1080;--disable-gpu;--disable-extensions;--incognito;--disable-infobars;--disable-popup-blocking;--disable-component-extensions-with-background-pages;--disable-default-apps;--disable-seccomp-filter-sandbox;--disable-hang-monitor;--disable-translate;--no-first-run;--no-default-browser-check

chrome.preferences=credentials_enable_service:false;profile.password_manager_enabled:false;profile.password_manager_leak_detection:false;credentials_enable_autosignin:false;profile.default_content_setting_values.notifications:2;profile.default_content_settings.popups:0;profile.managed_default_content_settings.popups:0;safebrowsing.enabled:false;profile.default_content_settings.cookies:0;credentials_enable_password_manager:false;profile.password_manager_onboarding_shown:true

# Edge Configuration with local driver fallback
webdriver.edge.driver=./drivers/msedgedriver.exe
webdrivermanager.forceupload=false
webdrivermanager.cachefolder=./drivers

