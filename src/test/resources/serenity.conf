
environment = dev
serenity.environment = "dev"
webdriver.driver = chrome

# Para activar/desactivar headless desde consola:
# Modo headless (sin ventana): mvn clean verify
# Modo visual (con ventana): mvn clean verify -Dheadless.mode=false
headless.mode = true

drivers {
  chrome {
    webdriver {
      driver = chrome
      autodownload = true
      capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = ["test-type", "ignore-certificate-errors", "headless", "--window-size=1920,1080",
            "incognito", "disable-infobars", "disable-gpu", "disable-default-apps", "disable-popup-blocking"]
        }
      }
    }
  }
  edge {
    webdriver {
      capabilities {
        browserName = "MicrosoftEdge"
        "ms:edgeOptions" {
          args = ["test-type", "ignore-certificate-errors", "headless", "--window-size=1920,1080",
            "incognito", "disable-infobars", "disable-gpu", "disable-default-apps", "disable-popup-blocking"]
        }
      }
    }
  }
  firefox {
    webdriver {
      capabilities {
        browserName = "firefox"
        pageLoadStrategy = "normal"
        acceptInsecureCerts = true
        unhandledPromptBehavior = "dismiss"
        strictFileInteractability = true

        "moz:firefoxOptions" {
          args = ["-headless"],
          prefs {
            "javascript.options.showInConsole": false
          },
          log {"level": "info"},
        }
      }
    }
  }
}

environments{
    dev {
      webdriver.base.url = "https://www.dev.saucedemo.com/"
    }

    uat {
      webdriver.base.url = "https://www.saucedemo.com/"
    }

    prd {
      webdriver.base.url = "https://www.prd.saucedemo.com/"
    }
}
