environment = uat
serenity.environment = "uat"
webdriver.driver = chrome

# Para activar/desactivar headless desde consola:
# Modo headless (sin ventana): mvn clean verify
# Modo visual (con ventana): mvn clean verify -Dheadless.mode=false
headless.mode = true

drivers {
  chrome {
      webdriver {
        driver = chrome
        autodownload = true
        capabilities {
          browserName = "chrome"
          acceptInsecureCerts = true
          "goog:chromeOptions" {
            # REEMPLAZA args con esto:
            args = [
              "user-data-dir=/tmp/chrome-profile-clean",
              "--disable-password-manager",
              "--disable-save-password-bubble",
              "--disable-credentials-autocomplete",
              "--disable-autofill",
              "--disable-sync",
              "--disable-blink-features=AutomationControlled",
              "--start-maximized",
              "--window-size=1920,1080",
              "--no-sandbox",
              "--disable-dev-shm-usage",
              "--disable-gpu",
              "--disable-extensions",
              "--disable-plugins",
              "incognito",
              "--no-first-run",
              "--no-default-browser-check",
              "disable-infobars"
            ]
            prefs {
              "credentials_enable_service": false,
              "profile.password_manager_enabled": false,
              "credentials_enable_autosignin": false,
              "profile.default_content_setting_values.notifications": 2,
              "profile.default_content_settings.popups": 0
            }
          }
        }
      }
  }
  edge {
    webdriver {
      capabilities {
        browserName = "MicrosoftEdge"
        "ms:edgeOptions" {
          args = [
            "test-type",
            "ignore-certificate-errors",
            "headless",
            "--window-size=1920,1080",
            "--start-maximized",
            "incognito",
            "disable-infobars",
            "disable-gpu",
            "disable-default-apps",
            "disable-popup-blocking",
            "--no-sandbox",
            "--disable-dev-shm-usage",
            "--disable-password-manager-reauthentication",
            "--disable-blink-features=AutomationControlled",

            # ✅ AÑADIDOS para Edge también
            "--disable-password-manager",
            "--disable-save-password-bubble",
            "--disable-credentials-autocomplete",
            "--disable-autofill",
            "--disable-sync"
          ]
          prefs {
            "credentials_enable_service": false,
            "profile.password_manager_enabled": false,
            "credentials_enable_autosignin": false,
            "profile.default_content_setting_values.notifications": 2,
            "profile.default_content_settings.popups": 0
          }
        }
      }
    }
  }
  firefox {
    webdriver {
      capabilities {
        browserName = "firefox"
        pageLoadStrategy = "normal"
        acceptInsecureCerts = true
        unhandledPromptBehavior = "dismiss"
        strictFileInteractability = true

        "moz:firefoxOptions" {
          args = ["-headless", "--width=1920", "--height=1080"],
          prefs {
            "javascript.options.showInConsole": false
          },
          log {"level": "info"},
        }
      }
    }
  }
}

environments{
    dev {
      webdriver.base.url = "https://www.dev.saucedemo.com/"
    }

    uat {
      webdriver.base.url = "https://www.saucedemo.com/"
    }

    prd {
      webdriver.base.url = "https://www.prd.saucedemo.com/"
    }
}